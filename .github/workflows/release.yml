name: Release

# Conventional commits on main open a release PR; merging it tags vX.Y.Z. That tag is what
# lazy.nvim's `version = "*"` and vim.pack's `vim.version.range()` resolve against.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: simple
